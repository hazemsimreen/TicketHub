    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Chat Demo</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 600px;
                margin: 40px auto;
            }

            #log {
                border: 1px solid #ccc;
                height: 300px;
                overflow-y: auto;
                padding: 8px;
                margin-bottom: 8px;
            }

            #log div {
                margin-bottom: 4px;
            }

            .error {
                color: red;
            }

            input, button {
                padding: 6px;
            }

            #token, #conversationId {
                width: 100%;
                margin-bottom: 8px;
                box-sizing: border-box;
            }

            #message {
                width: 70%;
            }
        </style>
    </head>
    <body>

    <h2>Chat Demo</h2>

    <label>Access token (from /api/Auth/login):</label>
    <input id="token" placeholder="Paste JWT accessToken here"/>

    <label>Conversation Id (Guid):</label>
    <input id="conversationId" placeholder="Paste a Conversation Id here"/>

    <button id="connectBtn">Connect + Join</button>

    <div id="log"></div>

    <input id="message" placeholder="Type a message..." disabled/>
    <button id="sendBtn" disabled>Send</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        const log = (text, isError = false) => {
            const div = document.createElement('div');
            div.textContent = text;
            if (isError) div.className = 'error';
            document.getElementById('log').appendChild(div);
            div.scrollIntoView();
        };

        let connection = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const token = document.getElementById('token').value.trim();
            const conversationId = document.getElementById('conversationId').value.trim();

            if (!token || !conversationId) {
                log('Enter both a token and a conversation id first.', true);
                return;
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl('/hubs/chat', {accessTokenFactory: () => token})
                .withAutomaticReconnect()
                .build();

            connection.on('ReceiveMessage', (message) => {
                log(`[${message.senderUserId}]: ${message.body}`);
            });

            connection.on('Error', (errorMessage) => {
                log(`Server error: ${errorMessage}`, true);
            });

            try {
                await connection.start();
                log('Connected.');

                await connection.invoke('JoinConversation', conversationId);
                log(`Joined conversation ${conversationId}.`);

                document.getElementById('message').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            } catch (err) {
                log(`Connection failed: ${err}`, true);
            }
        });

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const conversationId = document.getElementById('conversationId').value.trim();
            const messageInput = document.getElementById('message');
            const body = messageInput.value.trim();

            if (!body || !connection) return;

            try {
                await connection.invoke('SendMessage', conversationId, body);
                messageInput.value = '';
            } catch (err) {
                log(`Send failed: ${err}`, true);
            }
        });
    </script>

    </body>
    </html>
