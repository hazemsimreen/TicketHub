<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chat Demo</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1100px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
        }

        .panels {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }

        .panel h3 {
            margin-top: 0;
        }

        .log {
            border: 1px solid #ccc;
            height: 320px;
            overflow-y: auto;
            padding: 8px;
            margin-bottom: 8px;
            background: #fafafa;
            border-radius: 4px;
        }

        .log div {
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        .own {
            color: #0b5cff;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        .system {
            color: #888;
            font-style: italic;
        }

        input, button {
            padding: 6px;
            box-sizing: border-box;
        }

        .token, .conv, .message {
            width: 100%;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        .row .message {
            flex: 1;
        }

        button {
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<h2>Chat Demo (two sides)</h2>

<label>Conversation Id (Guid) — shared by both sides:</label>
<input id="conversationId" class="conv" placeholder="Paste a Conversation Id here" />

<div class="panels">
    <div class="panel" id="panel-left">
        <h3>Side A</h3>
        <label>Access token (from /api/Auth/login):</label>
        <input class="token" placeholder="Paste JWT accessToken here" />
        <button class="connectBtn">Connect + Join</button>
        <div class="status">Not connected</div>
        <div class="log"></div>
        <div class="row">
            <input class="message" placeholder="Type a message..." disabled />
            <button class="sendBtn" disabled>Send</button>
        </div>
    </div>

    <div class="panel" id="panel-right">
        <h3>Side B</h3>
        <label>Access token (from /api/Auth/login):</label>
        <input class="token" placeholder="Paste JWT accessToken here" />
        <button class="connectBtn">Connect + Join</button>
        <div class="status">Not connected</div>
        <div class="log"></div>
        <div class="row">
            <input class="message" placeholder="Type a message..." disabled />
            <button class="sendBtn" disabled>Send</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script>
    function setupPanel(panelId) {
        const panel = document.getElementById(panelId);
        const tokenInput = panel.querySelector('.token');
        const connectBtn = panel.querySelector('.connectBtn');
        const statusDiv = panel.querySelector('.status');
        const logDiv = panel.querySelector('.log');
        const messageInput = panel.querySelector('.message');
        const sendBtn = panel.querySelector('.sendBtn');

        let connection = null;
        let myUserId = null;

        const log = (text, cls) => {
            const div = document.createElement('div');
            div.textContent = text;
            if (cls) div.className = cls;
            logDiv.appendChild(div);
            div.scrollIntoView();
        };

        function decodeUserId(token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.sub
                    || payload.nameid
                    || payload['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier']
                    || null;
            } catch {
                return null;
            }
        }

        connectBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            const conversationId = document.getElementById('conversationId').value.trim();

            if (!token || !conversationId) {
                log('Enter a token (this side) and a conversation id (top field) first.', 'error');
                return;
            }

            myUserId = decodeUserId(token);

            connection = new signalR.HubConnectionBuilder()
                .withUrl('/hubs/chat', { accessTokenFactory: () => token })
                .withAutomaticReconnect()
                .build();

            connection.on('ReceiveMessage', (message) => {
                const mine = myUserId && message.senderUserId === myUserId;
                log(`[${message.senderUserId}]: ${message.body}`, mine ? 'own' : '');
            });

            connection.on('Error', (errorMessage) => {
                log(`Server error: ${errorMessage}`, 'error');
            });

            connection.onreconnecting(() => {
                statusDiv.textContent = 'Reconnecting...';
            });

            connection.onreconnected(() => {
                statusDiv.textContent = 'Connected';
            });

            connection.onclose(() => {
                statusDiv.textContent = 'Disconnected';
                messageInput.disabled = true;
                sendBtn.disabled = true;
            });

            try {
                await connection.start();
                statusDiv.textContent = 'Connected';
                log('Connected.', 'system');

                await connection.invoke('JoinConversation', conversationId);
                log(`Joined conversation ${conversationId}.`, 'system');

                messageInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.textContent = 'Connection failed';
                log(`Connection failed: ${err}`, 'error');
            }
        });

        const send = async () => {
            const conversationId = document.getElementById('conversationId').value.trim();
            const body = messageInput.value.trim();

            if (!body || !connection) return;

            try {
                await connection.invoke('SendMessage', conversationId, body);
                messageInput.value = '';
            } catch (err) {
                log(`Send failed: ${err}`, 'error');
            }
        };

        sendBtn.addEventListener('click', send);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });
    }

    setupPanel('panel-left');
    setupPanel('panel-right');
</script>

</body>
</html>
